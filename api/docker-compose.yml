services:
  db:
    image: postgres:16-alpine
    container_name: portal_postgres
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: modmos_portal
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portal_pg:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - modmos-db

  api:
    build: .
    container_name: portal_api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://portal:portal@portal_postgres:5432/modmos_portal?schema=public
      GOLD_DATABASE_URL: ${GOLD_DATABASE_URL:-}
      INVESTMENT_DATABASE_URL: ${INVESTMENT_DATABASE_URL:-postgresql://investment:investment@investment_postgres:5432/investment?schema=public}
      DISCORD_DATABASE_URL: ${DISCORD_DATABASE_URL:-postgresql://discord:discord@discord_postgres:5432/modmos_discord?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-12}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5174}
      DEFAULT_ADMIN_ENABLED: ${DEFAULT_ADMIN_ENABLED:-false}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-change-me}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Admin}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    networks:
      - modmos-db

networks:
  modmos-db:
    external: true
    name: modmos-db

volumes:
  portal_pg:
